<!-- light or dark: the saved choice, else the device's setting; set before the first paint -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("odd-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch{document.documentElement.dataset.theme="dark"}</script>
