<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Of Dragons Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="window">
  <div class="titlebar">
    <h1>Of Dragons Deep</h1>
    <div class="progress"><b id="caughtCount">0</b> / <span id="totalCount">0</span> caught</div>
  </div>
  <div class="body">
    <div class="toolbar">
      <div class="pages" id="pages"></div>
      <input class="search" id="search" type="search" placeholder="Search fish or zone…" autocomplete="off" aria-label="Search fish or zone" title="Search">
      <div class="spacer"></div>
      <button class="filter-btn edit-btn" id="editBtn" type="button" aria-pressed="false" aria-label="Edit mode: turn on to mark fish as caught">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.2V21h3.8l11-11-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg>
        <span class="label">Edit</span>
      </button>
      <button class="filter-btn" id="importBtn" type="button" aria-label="Import caught fish">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11 16h2V6.8l3.3 3.3 1.4-1.4L12 3 6.3 8.7l1.4 1.4L11 6.8zM4 18h16v2H4z"/></svg>
        <span class="label">Import</span>
      </button>
      <button class="filter-btn" id="filterBtn" type="button" aria-label="Filter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
        <span class="label">Filter</span> <span class="count" id="filterCount">0</span>
      </button>
      <div class="filter-panel" id="filterPanel">
        <h3>Status</h3>
        <label><input type="radio" name="status" value="all" checked> All</label>
        <label><input type="radio" name="status" value="caught"> Caught</label>
        <label><input type="radio" name="status" value="uncaught"> Not caught</label>
        <h3>Category</h3>
        <div id="expFilters"></div>
        <h3>Type</h3>
        <label><input type="checkbox" id="bigOnly"> Big fish only</label>
        <label><input type="checkbox" id="collOnly"> Collectables only</label>
        <button class="reset" id="resetFilters" type="button">Reset filters</button>
      </div>
    </div>

    <div class="grid" id="grid"><div class="empty-msg">Loading fish from ff14fish.carbuncleplushy.com…</div></div>

    <div class="footer">
      <div><span id="hint">Turn on <b>Edit</b> to mark fish as caught.</span> <span id="showing" class="showing"></span><div id="dataNote" class="note"></div></div>
      <div class="legend">
        <span><i style="background:var(--gold-hi);transform:rotate(45deg)"></i>Big fish</span>
        <span><i style="background:var(--caught);border-radius:50%"></i>Caught</span>
      </div>
    </div>
  </div>
</div>
<dialog class="import-dialog" id="importDialog">
  <form method="dialog" id="importForm">
    <h2>Import caught fish</h2>
    <p class="hint">Paste item IDs separated by commas, e.g. <code>4776, 4925, 4926</code>. Spaces and new lines are fine too.</p>
    <textarea id="importText" rows="6" placeholder="4776, 4925, 4926" spellcheck="false"></textarea>
    <label class="file-pick">or load a .txt / .csv file <input type="file" id="importFile" accept=".txt,.csv,text/plain,text/csv"></label>
    <div class="modes">
      <label><input type="radio" name="importMode" value="add" checked> Add to my caught fish</label>
      <label><input type="radio" name="importMode" value="replace"> Replace my caught fish with this list</label>
    </div>
    <div class="import-result" id="importResult" role="status"></div>
    <div class="actions">
      <button type="button" class="btn" id="importCancel">Close</button>
      <button type="submit" class="btn primary" id="importGo" value="import">Import</button>
    </div>
  </form>
</dialog>
<div class="tooltip" id="tooltip"></div>
<div class="toast import-result" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
